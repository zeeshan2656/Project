<!DOCTYPE html>
<html lang="en">

    <title>ApexFabric | Third-Party Fabrication Inspection & Audit Platform</title>

    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ApexFabric" />
    <meta name="application-name" content="ApexFabric" />
    <meta name="msapplication-TileColor" content="#0B1329" />
    <!-- Immediate PWA Install Prompt Capture for Direct Installation -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('apex:pwa_installable', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('apex:pwa_installed'));
      });
    </script>

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
