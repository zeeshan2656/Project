<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | ApexFabric Quality Audits</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0B1329;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem auto;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      border: 1.5px solid #38BDF8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    .logo-badge svg {
      width: 50px;
      height: 50px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 8px #EF4444;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #94A3B8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    button {
      background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);
      color: #FFFFFF;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    .hint {
      font-size: 0.8rem;
      color: #64748B;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="92" height="92" rx="20" fill="#0B1329" stroke="#38BDF8" stroke-width="3" />
        <g stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.85">
          <line x1="22" y1="30" x2="74" y2="30" />
          <line x1="20" y1="48" x2="76" y2="48" />
          <line x1="22" y1="66" x2="74" y2="66" />
          <line x1="30" y1="22" x2="30" y2="74" />
          <line x1="48" y1="20" x2="48" y2="76" />
          <line x1="66" y1="22" x2="66" y2="74" />
        </g>
        <circle cx="30" cy="30" r="3" fill="#38BDF8" />
        <circle cx="66" cy="30" r="3" fill="#38BDF8" />
        <circle cx="48" cy="48" r="4" fill="#06B6D4" />
        <circle cx="30" cy="66" r="3" fill="#38BDF8" />
        <circle cx="66" cy="66" r="3" fill="#38BDF8" />
        <path d="M 28 50 L 44 66 L 72 32" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>No Internet Connection</span>
    </div>

    <h1>You Are Currently Offline</h1>
    <p>ApexFabric requires a network connection to sync live inspection telemetry and audit checklists. Previously cached data remains accessible.</p>

    <div class="actions">
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>

    <div class="hint">
      The application will automatically resume when network connectivity is restored.
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
